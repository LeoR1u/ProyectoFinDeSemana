services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    user: "1000:1000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend:/var/www/html:z
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    user: "1000:1000"
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app:z
    ports:
      - "5173:5173"

volumes:
  pgdata:
